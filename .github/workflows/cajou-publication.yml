name: Prepare Cajou publication
on:
  push:
    branches: [publication-cajou-final-20261012]
    paths: ['.github/workflows/cajou-publication.yml', '.publication/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser for gallery verification
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect the normal guest entry to the supplied gallery
        shell: python
        run: |
          import json, pathlib, re
          from playwright.sync_api import sync_playwright
          out = pathlib.Path('/tmp/cajou-gallery'); out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width':1440,'height':1000})
              page.goto('https://birdsofpassageco.pic-time.com/-cajoulodge/gallery', wait_until='networkidle', timeout=90000)
              page.wait_for_timeout(4000)
              print('GALLERY BODY:', page.locator('body').inner_text())
              controls = page.locator('button,a,input').evaluate_all('(els)=>els.map(e=>({tag:e.tagName,type:e.type,text:e.innerText,placeholder:e.placeholder,name:e.name,href:e.getAttribute("href")}))')
              print('VISIBLE CONTROLS:', json.dumps(controls, ensure_ascii=False))
              (out/'entry.html').write_text(page.content())
              page.screenshot(path=str(out/'entry.png'),full_page=True)
              browser.close()
      - uses: actions/upload-artifact@v4
        with:
          name: cajou-gallery-inspection
          path: /tmp/cajou-gallery/
          retention-days: 1
